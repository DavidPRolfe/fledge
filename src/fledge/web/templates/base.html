<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}fledge{% endblock %}</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 960px;
    margin: 0 auto;
    padding: 1rem;
    color: #222;
    background: #fff;
    line-height: 1.4;
  }
  a { color: #0645ad; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 1.5rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  form { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: flex-start; }
  input, select, textarea, button { font: inherit; padding: 0.3rem 0.5rem; }
  textarea { flex: 1 1 20rem; min-height: 4rem; }
  .status { font-weight: bold; }
  .error { color: #b00020; white-space: pre-wrap; }
  .muted { color: #666; }
  .outputs { margin: 0; padding-left: 1rem; }
  #events {
    background: #f6f6f6;
    padding: 0.5rem;
    max-height: 30rem;
    overflow-y: auto;
    white-space: pre-wrap;
    font-family: ui-monospace, monospace;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<p><a href="/">fledge</a></p>
{% block content %}{% endblock %}
</body>
</html>
