{% extends "base.html" %}
{% block content %}
<h1>Runs</h1>

<h2>Launch</h2>
<form id="launch">
  <select name="workflow" required>
    {% for name in workflows %}<option value="{{ name }}">{{ name }}</option>{% endfor %}
  </select>
  <input name="ref" placeholder="ticket ref" required>
  <button type="submit">Launch</button>
</form>
<p id="launch-error" class="error"></p>

<table>
  <thead><tr><th>Title</th><th>Workflow</th><th>Status</th><th>Created</th></tr></thead>
  <tbody>
  {% for run in runs %}
    <tr>
      <td><a href="/runs/{{ run.id }}">{{ run.title }}</a></td>
      <td>{{ run.workflow }}</td>
      <td class="status">{{ run.status }}</td>
      <td>{{ run.created_at | time }}</td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="muted">No runs yet.</td></tr>
  {% endfor %}
  </tbody>
</table>

<script>
  const form = document.getElementById("launch");
  const errorBox = document.getElementById("launch-error");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorBox.textContent = "";
    const data = new FormData(form);
    const response = await fetch("/api/runs", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({workflow: data.get("workflow"), ref: data.get("ref")}),
    });
    const body = await response.json().catch(() => ({detail: response.status + " " + response.statusText}));
    if (response.status === 201) {
      window.location.href = "/runs/" + encodeURIComponent(body.id);
    } else {
      errorBox.textContent = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
    }
  });
</script>
{% endblock %}
