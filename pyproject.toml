[project]
name = "fledge"
version = "0.1.0"
description = "open source software factory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
fledge = "fledge.cli:main"

[project.entry-points."fledge.triggers"]
github_issues = "fledge.builtin.triggers.github_issues:GitHubIssuesTrigger"

[project.entry-points."fledge.workflows"]
ticket_to_pr = "fledge.builtin.workflows.ticket_to_pr:ticket_to_pr"

[project.entry-points."fledge.harnesses"]
claude_code = "fledge.builtin.harnesses.claude_code:ClaudeCodeHarness"
codex = "fledge.builtin.harnesses.codex:CodexHarness"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import sorting
    "N",             # naming
    "UP",            # modern syntax
    "B",             # bugbear: likely bugs
    "A",             # shadowing builtins
    "C4", "SIM", "RET", "PIE", "PERF", "FURB",  # needless complexity
    "C90",           # cyclomatic complexity
    "ARG",           # unused arguments
    "PTH",           # pathlib over os.path
    "ERA",           # commented-out code
    "T20",           # print statements
    "BLE",           # blind `except Exception`
    "TRY",           # exception anti-patterns (incl. logger.exception)
    "S",             # bandit security checks (SQL injection, etc.)
    "ANN",           # missing type annotations; ANN401 bans `Any` in signatures
    "FBT",           # boolean positional args
    "PL",            # pylint (incl. max-args)
    "PGH",           # blanket `# type: ignore` / `# noqa`
    "RUF",           # incl. ambiguous unicode, unused noqa
    "DTZ",           # naive datetimes
    "LOG", "G",      # logging misuse
    "PT",            # pytest style
    "SLF",           # private member access
]
ignore = [
    "E501",     # line length is the formatter's job
    "ISC001",   # conflicts with formatter
    "PLR2004",  # magic numbers: too noisy
    "TRY003",   # long exception messages: too noisy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "ARG", "PLR2004", "SLF001", "FBT"]

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]  # relax per-warning if a dependency is noisy

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-docker>=7.2.0.20261122",
]
