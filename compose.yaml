# Local factory: Postgres plus the control plane. Step containers are started
# by the control plane through the Docker socket and join the same network.
#
#   Write workflows in ./workflows and put the secrets in .env (see README.md)
#   docker compose up --build
#   With Podman the equivalent is: podman compose up --build
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fledge
      POSTGRES_PASSWORD: fledge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fledge"]
      interval: 2s
      timeout: 2s
      retries: 30

  fledge:
    build: .
    image: fledge:dev
    # Root only so it can use the Docker socket; step containers run as the
    # image's unprivileged user.
    user: root
    command: ["fledge", "serve"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:fledge@postgres/fledge
      FLEDGE_WORKFLOWS_DIR: /etc/fledge/workflows
    ports:
      - "127.0.0.1:8000:8000"
    # SELinux (on by default in the Podman machine) otherwise blocks the
    # container from using the socket.
    security_opt:
      - label=disable
    volumes:
      - ./workflows:/etc/fledge/workflows:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

networks:
  default:
    # Fixed name so FLEDGE_DOCKER_NETWORK's default can refer to it.
    name: fledge
